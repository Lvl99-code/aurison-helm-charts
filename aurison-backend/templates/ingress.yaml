{{- if .Values.ingress.enabled -}}
{{- $fullName := include "aurison-backend.fullname" . -}}
{{- $svcPort := .Values.service.port -}}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "aurison-backend.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.mtls.enabled }}
    # mTLS Configuration - optional globally, enforced on specific path
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ .Release.Namespace }}/{{ if .Values.mtls.existingSecret }}{{ .Values.mtls.existingSecretName | default "aurison-backend-ca-secret-cert" }}{{ else }}{{ $fullName }}-ca-secret-cert{{ end }}
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    {{- end }}
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "{{ $fullName }}-ws"
    # Configuration snippet for headers and mTLS enforcement on specific path
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # WebSocket upgrade headers
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      {{- if .Values.mtls.enabled }}
      # Pass client certificate info to backend
      proxy_set_header X-SSL-Client-Certificate $ssl_client_escaped_cert;
      proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
      proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
      # Enforce mTLS only on PACS endpoint
      if ($request_uri ~* "^/ws/pacs/connect") {
        set $mtls_check "${ssl_client_verify}";
        if ($mtls_check != "SUCCESS") {
          return 403 "Client certificate verification failed";
        }
      }
      {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .backend.serviceName }}
                port:
                  number: {{ .backend.servicePort }}
          {{- end }}
    {{- end }}
  {{- end }}
